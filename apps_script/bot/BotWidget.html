    position: absolute; top: 4px; right: 4px; width: 14px; height: 14px; border-radius: 50%;
    background: #1538be; border: 2px solid #ffffff; animation: hottie-latido 1.8s ease-in-out infinite;
  }
  @keyframes hottie-latido { 50% { box-shadow: 0 0 0 6px rgba(21, 56, 190, .25); } }
  .hottie-saludo {
    position: fixed; right: 96px; bottom: 34px; z-index: 2147483000; max-width: 230px;
    background: #191b1f; color: #ffffff; border: 0; border-radius: 12px 12px 3px 12px;
    padding: 9px 12px; font: 14px/1.35 "Helvetica Neue", Helvetica, Arial, sans-serif; box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
  }
  .hottie-panel {
    position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: 100px; z-index: 2147483001;
    width: min(400px, calc(100vw - 24px)); height: min(620px, calc(100vh - 130px));
    border: 1px solid #34373f; border-radius: 12px; overflow: hidden; background: #191b1f;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
    transform-origin: bottom right; animation: hottie-abrir .18s ease-out;
  }
  @keyframes hottie-abrir { from { transform: scale(.92); opacity: 0; } }
  .hottie-panel iframe { width: 100%; height: 100%; border: 0; display: block; }
  .hottie-panel[hidden], .hottie-saludo[hidden] { display: none !important; }
  @media (max-width: 520px) {
    .hottie-panel { right: 0; bottom: 0; width: 100vw; height: 100%; border-radius: 0; }

<div class="hottie-saludo" id="hottie-saludo" hidden>¿Buscás algo? Preguntame 😉</div>
<button class="hottie-lanzador" id="hottie-lanzador" type="button" aria-label="Abrir chat con hottie" aria-expanded="false">
  <img src="<?!= botInclude('BotAvatar') ?>" alt="">
  <span class="hottie-punto"></span>
</button>
<div class="hottie-panel" id="hottie-panel" hidden role="dialog" aria-label="Chat con hottie"></div>

<script>
(function () {
  var URL_CHAT = '<?!= botUrl("bot") ?>';
  var lanzador = document.getElementById('hottie-lanzador');
  var panel = document.getElementById('hottie-panel');
  var saludo = document.getElementById('hottie-saludo');

  function abrir(si) {
    if (si && !panel.firstChild) {
      // El chat se carga recién la primera vez que se abre.
      var f = document.createElement('iframe');
      f.src = URL_CHAT; f.title = 'Chat con hottie'; f.allow = 'clipboard-write';
      panel.appendChild(f);
    }
    panel.hidden = !si; saludo.hidden = true;
    lanzador.setAttribute('aria-expanded', String(si));
  }
  lanzador.addEventListener('click', function () { abrir(panel.hidden); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) abrir(false); });

  // Saludo una vez por sesión, a los pocos segundos.
  try {
    if (!sessionStorage.getItem('hottie-saludo')) {
      setTimeout(function () { if (panel.hidden) { saludo.hidden = false; setTimeout(function () { saludo.hidden = true; }, 6000); } }, 2500);
      sessionStorage.setItem('hottie-saludo', '1');
    }
  } catch (e) { /* sin sessionStorage: no saluda */ }
})();
</script>
